<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Unit & Measurement Converter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; }
        label { font-size: 14px; color: #5f6368; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .result { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 8px; text-align: center; font-weight: bold; color: #1967d2; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Unit Converter</h2>
        <label for="val">Enter Value:</label>
        <input type="number" id="val" value="1" oninput="convert()">

        <label for="type">Conversion Type:</label>
        <select id="type" onchange="convert()">
            <option value="km_m">Kilometers (km) to Meters (m)</option>
            <option value="m_km">Meters (m) to Kilometers (km)</option>
            <option value="kg_g">Kilograms (kg) to Grams (g)</option>
            <option value="c_f">Celsius (°C) to Fahrenheit (°F)</option>
        </select>

        <div class="result" id="output">Result: 1000 m</div>
    </div>

    <script>
        function convert() {
            let input = parseFloat(document.getElementById('val').value);
            let type = document.getElementById('type').value;
            let res = 0;
            let unit = '';

            if (isNaN(input)) {
                document.getElementById('output').innerText = 'Please enter a valid number';
                return;
            }

            if (type === 'km_m') { res = input * 1000; unit = 'm'; }
            else if (type === 'm_km') { res = input / 1000; unit = 'km'; }
            else if (type === 'kg_g') { res = input * 1000; unit = 'g'; }
            else if (type === 'c_f') { res = (input * 9/5) + 32; unit = '°F'; }

            document.getElementById('output').innerText = `Result: ${res.toLocaleString()} ${unit}`;
        }
    </script>
</body>
</html>
